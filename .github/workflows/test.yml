name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Real Postgres for the Row Level Security tests (test/db.test.js).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGTEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: RLS tests must have run, not skipped
        run: node --test test/db.test.js 2>&1 | tee /tmp/db.txt && grep -q '^# pass 1' /tmp/db.txt
      - run: npm audit --omit=dev
      # React app (web/): types, unit tests, production build with the size budget.
      - run: npm ci
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm audit --omit=dev
        working-directory: web
      # What Vercel serves: old pages plus the pre-rendered React pages.
      - run: node scripts/build-site.mjs
